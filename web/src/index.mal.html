<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halvårsundersøkelsen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --fjordbla:#243F4D; --alvesand:#F8F1E3; --dis:#D8DCD3; --skogmose:#9DAC86; --solheim:#E6C08D;
  --solheim-ink:#9A7126; --taupe:#7E7971; --gull:#C99A3F; --ink-soft:#4A6271; --ink-mute:#8AA0A8;
  --glass:rgba(36,63,77,.045); --glass-line:rgba(36,63,77,.14);
  --glass-d:rgba(248,241,227,.07); --glass-line-d:rgba(248,241,227,.18);
  --serif:"Libre Baskerville",Georgia,"Times New Roman",serif;
  --sans:"League Spartan","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r-sm:6px; --r-md:14px; --r-lg:24px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--alvesand);color:var(--fjordbla);font-family:var(--sans);font-size:17px;line-height:1.4;min-height:100vh}
body.mork{background:var(--fjordbla);color:var(--alvesand)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.skjult{display:none !important}

/* Topp: alltid synlig, viser fremdrift */
.topp{position:sticky;top:0;z-index:5;background:var(--alvesand);border-bottom:1px solid var(--glass-line)}
body.mork .topp{background:var(--fjordbla);border-bottom-color:var(--glass-line-d)}
.topp-inn{max-width:860px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:14px}
.logo{width:38px;height:auto;flex:none;color:var(--fjordbla)}
body.mork .logo{color:var(--alvesand)}
.status{flex:1;min-width:0;font-size:15px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mork .status{color:var(--dis)}
.hvem{font-size:13.5px;color:var(--ink-soft);text-align:right;line-height:1.2}
.hvem small{display:block;color:var(--ink-mute);font-size:12px}
body.mork .hvem{color:var(--dis)}
.topp .knapp{min-height:36px;padding:6px 14px;font-size:15.5px}
.fremdrift{height:4px;background:var(--glass-line)}
.fremdrift i{display:block;height:100%;width:0;background:var(--skogmose);transition:width .25s ease}
.demo{background:var(--dis);color:var(--fjordbla);font-size:13.5px;text-align:center;padding:4px 12px}

/* Personvern øverst (mørk flate) */
.hero{background:var(--fjordbla);color:var(--alvesand)}
.hero-inn{max-width:860px;margin:0 auto;padding:34px 20px 30px}
.eyebrow{font-size:14.5px;letter-spacing:.04em;color:var(--skogmose);margin-bottom:8px}
.hero h1,.takk h1{font-size:clamp(30px,5.4vw,46px);line-height:1.12;color:var(--solheim);margin-bottom:14px}
.hero h1 em,.takk h1 em{font-style:italic}
.ingress{font-size:19.5px;line-height:1.45;max-width:38em}
.kort-rad{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:24px 0 18px}
.kort{background:var(--glass-d);border:1px solid var(--glass-line-d);border-radius:var(--r-md);padding:14px 16px 16px}
.kort .card-eyebrow{font-size:13.5px;letter-spacing:.04em;color:var(--solheim);margin-bottom:6px}
.kort.gronn .card-eyebrow{color:var(--skogmose)}
.kort.taupe .card-eyebrow{color:var(--dis)}
.kort h3{font-size:17.5px;line-height:1.25;color:var(--alvesand);margin-bottom:6px}
.kort p{font-size:15.5px;color:var(--dis)}
.fotnoter{list-style:none;padding:0;margin:0;font-size:15px;color:var(--dis);display:grid;gap:4px}
.fotnoter li{padding-left:16px;position:relative}
.fotnoter li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--skogmose)}

main{max-width:860px;margin:0 auto;padding:8px 20px 60px}
.innhold{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px;padding:0;list-style:none}
.innhold a{display:inline-block;font-size:14px;color:var(--ink-soft);text-decoration:none;border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:4px 9px}
.innhold a.ferdig{background:rgba(157,172,134,.35);border-color:var(--skogmose);color:var(--fjordbla)}
.innhold a:hover{border-color:var(--fjordbla)}

/* Seksjoner og spørsmål */
.del{padding-top:26px;scroll-margin-top:60px}
.del-hode{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.del-hode .nr{font-size:14.5px;letter-spacing:.04em;color:var(--solheim-ink)}
.del-hode h2{font-size:25px;line-height:1.2}
.del-hode p{color:var(--ink-soft);font-size:15.5px;flex-basis:100%}
.spm{background:var(--glass);border:1px solid var(--glass-line);border-left:4px solid var(--glass-line);border-radius:var(--r-sm);padding:10px 12px 11px;margin-bottom:7px;scroll-margin-top:70px}
.spm.svart{border-left-color:var(--skogmose)}
.spm.blink{animation:blink 1.2s ease 1}
@keyframes blink{0%,60%{background:rgba(230,192,141,.45)}100%{background:var(--glass)}}
.sptekst,label.tekst{font-size:16.5px;line-height:1.3;display:block;margin-bottom:8px}
.valg{display:grid;gap:5px}
.valg.fem{grid-template-columns:repeat(5,1fr)}
.valg.fire{grid-template-columns:repeat(4,1fr)}
.valg.ti{grid-template-columns:repeat(10,1fr);gap:4px}
/* Hvert svaralternativ har sin egen farge (--f). Uvalgt vises den dempet, valgt vises den fullt med mørk ramme. */
.valg button{position:relative;min-height:34px;padding:4px 5px;border-radius:var(--r-sm);border:1px solid color-mix(in srgb,var(--f) 45%,var(--alvesand));
  background:color-mix(in srgb,var(--f) 17%,var(--alvesand));font-size:14px;line-height:1.12;text-align:center;transition:background .1s,box-shadow .1s}
.valg.ti button{font-size:15px;min-height:32px;padding:3px 0}
.valg button:hover{background:color-mix(in srgb,var(--f) 50%,var(--alvesand))}
/* Når et svar er valgt, tones de andre alternativene ytterligere ned. */
.spm.svart .valg button:not([aria-pressed="true"]){background:color-mix(in srgb,var(--f) 7%,var(--alvesand));border-color:var(--glass-line);color:var(--ink-soft)}
.spm.svart .valg button:not([aria-pressed="true"]):hover{background:color-mix(in srgb,var(--f) 35%,var(--alvesand));color:var(--fjordbla)}
.valg button[aria-pressed="true"]{background:var(--f);color:var(--t);border-color:var(--fjordbla);box-shadow:inset 0 0 0 2px var(--fjordbla);font-weight:500}
.valg button:focus-visible,.knapp:focus-visible,.ekstra button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--fjordbla);outline-offset:2px}
.ender{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:3px}
.ekstra{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.ekstra button{min-height:28px;padding:2px 10px;border-radius:var(--r-sm);border:1px dashed var(--taupe);background:transparent;font-size:13.5px;color:var(--ink-soft)}
.ekstra button[aria-pressed="true"]{background:var(--taupe);border-style:solid;border-color:var(--fjordbla);box-shadow:inset 0 0 0 1px var(--fjordbla);color:var(--alvesand)}
textarea{width:100%;min-height:84px;resize:vertical;font:inherit;font-size:16px;color:var(--fjordbla);background:rgba(248,241,227,.7);border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:7px 10px;display:block}
.hjelp{font-size:14px;color:var(--ink-soft);margin-top:5px}
.spm.kommentar .card-eyebrow{font-size:13px;letter-spacing:.04em;color:var(--solheim-ink);margin-bottom:2px}
textarea::placeholder{color:var(--ink-mute)}
.mangler.kom button{border-color:var(--skogmose)}

/* Levering nederst */
.lever{margin-top:34px;background:var(--dis);border-radius:var(--r-md);padding:20px 20px 22px;scroll-margin-top:70px}
.lever .eyebrow{color:var(--solheim-ink)}
.lever h2{font-size:25px;margin-bottom:6px}
.lever p{font-size:16.5px;margin-bottom:10px}
.mangler{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px}
.mangler button{border:1px solid var(--solheim-ink);background:rgba(248,241,227,.6);border-radius:var(--r-sm);font-size:14px;padding:4px 9px}
.knapp{min-height:46px;padding:9px 22px;border-radius:var(--r-sm);border:1px solid var(--fjordbla);background:var(--fjordbla);color:var(--alvesand);font-size:17.5px}
.knapp.lys{background:transparent;color:var(--fjordbla)}
.knapp[disabled]{opacity:.5;cursor:default}
.feil{border:1px solid var(--solheim-ink);background:rgba(248,241,227,.6);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:12px}
.takk{max-width:860px;margin:0 auto;padding:60px 20px}

@media (max-width:640px){
  .kort-rad{grid-template-columns:1fr}
  .valg.fem,.valg.fire{grid-template-columns:1fr}
  .valg.fem button,.valg.fire button{text-align:left;padding-left:12px;min-height:32px}
  .valg.ti{grid-template-columns:repeat(5,1fr)}
  .hvem{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="demo" id="demo">Prototype. Ingenting lagres eller sendes.</div>
<header class="topp">
  <div class="topp-inn">
    <svg class="logo" viewBox="0 0 305 165" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alv"><path d="M197.156 164.919C192.41 151.158 187.705 137.358 182.959 123.597C172.813 123.597 162.667 123.597 152.52 123.597C138.447 82.3982 124.373 41.1991 110.299 0C95.8571 0 81.3742 0 66.9323 0C85.7927 55 104.694 109.959 123.555 164.959C148.102 164.959 172.649 164.959 197.156 164.919Z" fill="currentColor"/><path d="M58.7498 0H56.4178C37.5983 55 18.8196 110 0 164.959C14.4011 164.959 28.8021 164.959 43.2032 164.959C48.89 148.349 54.5768 131.739 60.3045 115.17C72.9463 115.17 85.6291 115.17 98.271 115.17C85.0972 76.7802 71.9235 38.3901 58.7498 0Z" fill="currentColor"/><path d="M305 0.000183243C290.517 0.000183243 276.034 0.000183243 261.551 0.000183243C249.973 33.8307 238.395 67.7019 226.817 101.532C215.239 67.7019 203.661 33.8714 192.082 0.000183243C177.6 0.000183243 163.158 0.000183243 148.675 0.000183243C167.576 55.0002 186.478 109.959 205.379 164.959H248.378C267.238 109.959 286.14 54.9595 305 -0.0405273V0.000183243Z" fill="currentColor"/></svg>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="hvem" id="hvem"></div>
    <button class="knapp skjult" id="tilLever" type="button">Til levering</button>
  </div>
  <div class="fremdrift" aria-hidden="true"><i id="fremdrift"></i></div>
</header>

<div id="side"></div>

<script>
/* Oppsett. DEMO = true betyr at siden kjører uten server: ingen innlogging, ingen lagring, ingen innsending. */
const DEMO = /*__DEMO__*/true;
const DATA = /*__DATA__*/null;
const UTKAST_NOKKEL = 'halvaar-utkast-' + DATA.runde;

const svar = {};            // kode -> verdi (tekst slik den lagres i Airtable, eller tall 1–10)
let bruker = DEMO ? {navn: 'Ola Nordmann'} : null;
let sender = false, feil = '';

const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...barn) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  }
  for (const b of barn.flat()) if (b != null) n.append(b.nodeType ? b : document.createTextNode(b));
  return n;
};
const alle = DATA.deler.flatMap(d => d.sporsmal);
const lukkede = alle.filter(q => q.type !== 'tekst');
const kommentarer = alle.filter(q => q.type === 'tekst');
const erSvart = q => svar[q.kode] !== undefined && svar[q.kode] !== '';
const antallSvart = liste => liste.filter(erSvart).length;

/* ---------- Fargekoding ----------
   Rød (Tegl) → grå (Dis) → grønn (Mose), uten gult. Mose (#527645) er en dypere utgave av Skogmose,
   like sterk som Tegl, slik at enig-siden synes like godt som uenig-siden.
   Tegl (#B34B36) er lagt til utenfor Alv-paletten, etter avtale med Marcus, fordi paletten ikke har rødt.
   Fargen sier hvilket svar det er, ikke om svaret er bra eller dårlig. */
const SKOGMOSE = '#9DAC86', MOSE = '#527645', DIS = '#D8DCD3', SOLHEIM = '#E6C08D', TEGL = '#B34B36', ALVESAND = '#F8F1E3', FJORDBLA = '#243F4D';
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const miks = (a, b, t) => '#' + rgb(a).map((x, i) => Math.round(x + (rgb(b)[i] - x) * t).toString(16).padStart(2, '0')).join('');
const lysstyrke = h => { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const kontrast = (a, b) => (Math.max(lysstyrke(a), lysstyrke(b)) + 0.05) / (Math.min(lysstyrke(a), lysstyrke(b)) + 0.05);
const tekstPa = h => kontrast(h, ALVESAND) > kontrast(h, FJORDBLA) ? ALVESAND : FJORDBLA;   // best lesbare tekst på valgt svar
const LYS_GRONN = miks(MOSE, ALVESAND, 0.45);
// Samme retning overalt: lavt og uenig til venstre (rødt), høyt og enig til høyre (grønt).
const LIKERT_VIST = [...DATA.likert].reverse();                                   // helt uenig … helt enig
const LYS_ROD = miks(TEGL, ALVESAND, 0.45);
const LIKERT_FARGER = [TEGL, LYS_ROD, DIS, LYS_GRONN, MOSE];
const SKALA_STOPP = [[0, TEGL], [0.25, miks(TEGL, ALVESAND, 0.45)], [0.5, DIS], [0.75, LYS_GRONN], [1, MOSE]];
function skalaFarge(n) {                                                          // n = 1 … 10
  const t = (n - 1) / 9;
  for (let i = 1; i < SKALA_STOPP.length; i++) {
    const [t0, c0] = SKALA_STOPP[i - 1], [t1, c1] = SKALA_STOPP[i];
    if (t <= t1) return miks(c0, c1, (t - t0) / (t1 - t0));
  }
  return MOSE;
}
const NOYTRAL_FARGER = [DIS, DIS, DIS, DIS, DIS];
const FREKVENS_FARGER = [miks(MOSE, ALVESAND, 0.84), miks(MOSE, ALVESAND, 0.63), miks(MOSE, ALVESAND, 0.42), miks(MOSE, ALVESAND, 0.21), MOSE];   // sjelden … mye hver dag

/* Utkast ligger bare i nettleseren, aldri på serveren. I prototypen holdes det kun i minnet. */
function lagreUtkast() { if (DEMO) return; try { localStorage.setItem(UTKAST_NOKKEL, JSON.stringify(svar)); } catch (e) {} }
function hentUtkast() { if (DEMO) return; try { Object.assign(svar, JSON.parse(localStorage.getItem(UTKAST_NOKKEL) || '{}')); } catch (e) {} }
function slettUtkast() { if (DEMO) return; try { localStorage.removeItem(UTKAST_NOKKEL); } catch (e) {} }

function settSvar(q, verdi) {
  if (verdi === undefined || verdi === '') delete svar[q.kode]; else svar[q.kode] = verdi;
  lagreUtkast();
  oppdater();
}

/* ---------- Spørsmål ---------- */
function knappRad(q, klasse, valg, farger, etikett = v => v) {
  const rad = el('div', {class: 'valg ' + klasse});
  valg.forEach((v, i) => rad.append(el('button', {type: 'button', style: '--f:' + farger[i] + ';--t:' + tekstPa(farger[i]), 'aria-pressed': String(svar[q.kode] === v),
    onclick: () => { settSvar(q, svar[q.kode] === v ? undefined : v); tegnSpm(q); }}, etikett(v))));
  return rad;
}
function ekstraRad(q) {
  if (!q.ekstra || !q.ekstra.length) return null;
  const rad = el('div', {class: 'ekstra'});
  for (const v of q.ekstra) rad.append(el('button', {type: 'button', 'aria-pressed': String(svar[q.kode] === v),
    onclick: () => { settSvar(q, svar[q.kode] === v ? undefined : v); tegnSpm(q); }}, v));
  return rad;
}
function byggSpm(q) {
  const id = 'spm-' + q.kode;
  if (q.type === 'tekst') {
    const ta = el('textarea', {id: id + '-felt', rows: 3, placeholder: 'Skriv her', oninput: e => {
      settSvar(q, e.target.value.trim() ? e.target.value : undefined);
      $(id).classList.toggle('svart', erSvart(q));
    }});
    ta.value = svar[q.kode] || '';
    return el('div', {class: 'spm kommentar' + (erSvart(q) ? ' svart' : ''), id},
      el('div', {class: 'card-eyebrow'}, 'Kommentar'),
      el('label', {class: 'tekst', for: id + '-felt'}, q.tekst), ta,
      q.tekst.startsWith('Kommentarer') && DATA.deler.find(d => d.sporsmal.includes(q)).sporsmal.some(x => x.type !== 'tekst') ? el('p', {class: 'hjelp'}, 'Hva ligger bak svarene dine i denne delen? Skriv gjerne noen ord, korte stikkord er nok.') : null);
  }
  const boks = el('div', {class: 'spm' + (erSvart(q) ? ' svart' : ''), id, role: 'group', 'aria-labelledby': id + '-t'},
    el('div', {class: 'sptekst', id: id + '-t'}, q.tekst));
  const ti = Array.from({length: 10}, (_, i) => skalaFarge(i + 1));
  if (q.type === 'likert') boks.append(knappRad(q, 'fem', LIKERT_VIST, LIKERT_FARGER));
  else if (q.type === 'valg') boks.append(knappRad(q, q.valg.length === 4 ? 'fire' : 'fem', q.valg, q.kode === 'KI-01' ? FREKVENS_FARGER : NOYTRAL_FARGER));
  else if (q.type === 'skala') boks.append(
    knappRad(q, 'ti', Array.from({length: 10}, (_, i) => q.verdier[String(i + 1)]), ti, v => String(parseInt(v, 10))),
    el('div', {class: 'ender'}, el('span', {}, '1 ' + q.lav), el('span', {}, '10 ' + q.hoy)));
  else if (q.type === 'tall') boks.append(
    knappRad(q, 'ti', Array.from({length: 10}, (_, i) => i + 1), ti, v => String(v)),
    el('div', {class: 'ender'}, el('span', {}, 'Lavest'), el('span', {}, 'Høyest')));
  const ekstra = ekstraRad(q);
  if (ekstra) boks.append(ekstra);
  return boks;
}
function tegnSpm(q) {
  const gammel = $('spm-' + q.kode);
  if (!gammel) return;
  const aktiv = document.activeElement && gammel.contains(document.activeElement) ? document.activeElement.textContent : null;
  const ny = byggSpm(q);
  gammel.replaceWith(ny);
  const fokus = aktiv && [...ny.querySelectorAll('button')].find(b => b.textContent === aktiv);
  if (fokus) fokus.focus({preventScroll: true});
}

/* ---------- Siden: alt på én side ---------- */
function hero() {
  const h1 = el('h1'); h1.innerHTML = 'Svarene dine er <em>anonyme</em>';
  return el('section', {class: 'hero'}, el('div', {class: 'hero-inn'},
    el('div', {class: 'eyebrow'}, DATA.tittel + ' · ' + DATA.periode), h1,
    el('p', {class: 'ingress'}, 'Du logger inn for at systemet skal vite hvem som bør få en påminnelse. Det brukes aldri til å se hva du svarer.'),
    el('div', {class: 'kort-rad'},
      el('div', {class: 'kort gronn'}, el('div', {class: 'card-eyebrow'}, 'Innlogging'), el('h3', {}, 'Derfor logger du inn'),
        el('p', {}, 'Innloggingen brukes til én ting. Svarsiden holder oversikt over hvem som har levert, slik at bare de som mangler får en påminnelse.')),
      el('div', {class: 'kort'}, el('div', {class: 'card-eyebrow'}, 'Lagring'), el('h3', {}, 'To ting lagres hver for seg'),
        el('p', {}, 'At du har svart, lagres i svarsiden. Selve svarene sendes til Airtable uten navn, e-post eller noe annet som peker på deg.')),
      el('div', {class: 'kort gronn'}, el('div', {class: 'card-eyebrow'}, 'Tidspunkt'), el('h3', {}, 'Tidspunktet røper deg ikke'),
        el('p', {}, 'Svarene sendes ikke videre i det du leverer. De samles opp og overføres i bolker, i tilfeldig rekkefølge. Tidsstempelet i Airtable viser derfor når bolken ble overført, ikke når du svarte.')),
      el('div', {class: 'kort taupe'}, el('div', {class: 'card-eyebrow'}, 'Innsyn'), el('h3', {}, 'Ingen ser hvem som svarte hva'),
        el('p', {}, 'Det gjelder også Marcus og resten av admin. De ser bare hvor mange som har svart, og resultatene samlet.'))),
    el('ul', {class: 'fotnoter'},
      el('li', {}, 'Skriv gjerne kommentarer underveis. De forklarer det tallene ikke kan, og er det vi har mest nytte av.'),
      el('li', {}, 'Kommentarene leses uten navn, akkurat slik du skriver dem. Det er bare innholdet som kan fortelle hvem du er.'),
      el('li', {}, 'Utkastet ditt ligger bare i denne nettleseren til du leverer.'),
      el('li', {}, 'Et levert svar kan ikke hentes frem eller endres, fordi ingen vet hvilket som er ditt.'),
      el('li', {}, alle.length + ' spørsmål på én side. Du kan hoppe over det du ikke vil svare på.'),
      DATA.fristTekst ? el('li', {}, 'Svarfristen er ' + DATA.fristTekst + '.') : null)));
}
function innholdListe() {
  const ul = el('ul', {class: 'innhold', id: 'innhold', 'aria-label': 'Seksjoner'});
  DATA.deler.forEach((d, i) => {
    const l = d.sporsmal.filter(q => q.type !== 'tekst');
    const ferdig = l.length ? antallSvart(l) === l.length : antallSvart(d.sporsmal) > 0;
    ul.append(el('li', {}, el('a', {href: '#del-' + (i + 1), class: ferdig ? 'ferdig' : ''}, (i + 1) + '. ' + d.tittel)));
  });
  return ul;
}
function leverBoks() {
  const ubesvart = lukkede.filter(q => !erSvart(q));
  const boks = el('section', {class: 'lever', id: 'lever'},
    el('div', {class: 'eyebrow'}, 'Levering'),
    el('h2', {}, ubesvart.length ? 'Nesten ferdig' : 'Klar til å levere'),
    el('p', {}, ubesvart.length
      ? 'Du har ' + ubesvart.length + (ubesvart.length === 1 ? ' ubesvart spørsmål.' : ' ubesvarte spørsmål.') + ' Du kan levere likevel, eller gå til dem her.'
      : 'Du har svart på alle spørsmålene med svaralternativer.'));
  if (ubesvart.length) {
    const ul = el('ul', {class: 'mangler'});
    DATA.deler.forEach((d, i) => {
      const m = d.sporsmal.filter(q => q.type !== 'tekst' && !erSvart(q));
      if (m.length) ul.append(el('li', {}, el('button', {type: 'button', onclick: () => gaTilSpm(m[0])}, (i + 1) + '. ' + d.tittel + ' (' + m.length + ')')));
    });
    boks.append(ul);
  }
  const tomme = kommentarer.filter(q => !erSvart(q)), skrevet = kommentarer.length - tomme.length;
  boks.append(el('p', {}, skrevet === 0 ? 'Du har ikke skrevet noen kommentarer ennå. Vil du legge til noe før du leverer?'
    : tomme.length ? 'Du har skrevet ' + skrevet + (skrevet === 1 ? ' kommentar. ' : ' kommentarer. ') + 'Takk. Her kan du utdype mer hvis du vil.'
    : 'Du har skrevet i alle ' + kommentarer.length + ' kommentarfeltene. Takk.'));
  if (tomme.length) {
    const ul = el('ul', {class: 'mangler kom'});
    for (const q of tomme) {
      const i = DATA.deler.findIndex(d => d.sporsmal.includes(q));
      const flere = DATA.deler[i].sporsmal.filter(x => x.type === 'tekst').length > 1;
      const navn = !flere ? DATA.deler[i].tittel : q.tekst.length > 42 ? q.tekst.slice(0, 40).trim() + ' …' : q.tekst;
      ul.append(el('li', {}, el('button', {type: 'button', onclick: () => gaTilSpm(q)}, navn)));
    }
    boks.append(ul);
  }
  boks.append(el('p', {}, 'Når du leverer, kan svarene ikke hentes frem eller endres. Det eneste som lagres om deg, er at du har levert.'));
  if (feil) boks.append(el('div', {class: 'feil', role: 'alert'}, feil));
  boks.append(el('button', {class: 'knapp', type: 'button', id: 'leverKnapp', disabled: sender, onclick: lever}, sender ? 'Leverer …' : 'Lever svarene'));
  return boks;
}
function gaTilSpm(q) {
  const n = $('spm-' + q.kode);
  if (!n) return;
  n.scrollIntoView({block: 'center'});
  n.classList.remove('blink'); void n.offsetWidth; n.classList.add('blink');
  const b = n.querySelector('textarea, button'); if (b) b.focus({preventScroll: true});
}
function tegnSkjema() {
  document.body.classList.remove('mork');
  const main = el('main', {id: 'main'}, innholdListe());
  DATA.deler.forEach((d, i) => main.append(el('section', {class: 'del', id: 'del-' + (i + 1)},
    el('div', {class: 'del-hode'}, el('span', {class: 'nr'}, 'Del ' + (i + 1)), el('h2', {}, d.tittel), el('p', {}, d.ingress)),
    d.sporsmal.map(byggSpm))));
  main.append(leverBoks());
  $('side').replaceChildren(hero(), main);
  $('tilLever').classList.remove('skjult');
  oppdater();
}
function tegnTakk(alleredeLevert) {
  document.body.classList.add('mork');
  const h1 = el('h1'); h1.innerHTML = alleredeLevert ? 'Du har allerede <em>levert</em>' : 'Takk for at du <em>svarte</em>';
  $('side').replaceChildren(el('section', {class: 'takk'},
    el('div', {class: 'eyebrow'}, DATA.tittel + ' · ' + DATA.periode), h1,
    el('p', {class: 'ingress'}, alleredeLevert
      ? 'Svaret ditt er registrert. Det kan ikke hentes frem eller endres, fordi ingen vet hvilket som er ditt.'
      : 'Svarene dine er levert uten navn. Det eneste som er lagret om deg, er at du har levert, slik at du ikke får påminnelser.'),
    DEMO && !alleredeLevert ? el('p', {class: 'ingress', style: 'margin-top:16px;font-size:16px;color:var(--dis)'}, 'Dette er en prototype, så ingenting ble sendt.') : null));
  $('tilLever').classList.add('skjult');
  $('fremdrift').style.width = '100%';
  $('status').textContent = DATA.tittel + ' · ' + DATA.periode;
  window.scrollTo(0, 0);
}
function oppdater() {
  const n = antallSvart(lukkede);
  $('fremdrift').style.width = (100 * n / lukkede.length) + '%';
  const k = antallSvart(kommentarer);
  $('status').textContent = n + ' av ' + lukkede.length + ' besvart · ' + k + ' av ' + kommentarer.length + ' kommentarer';
  $('hvem').replaceChildren(...(bruker ? [document.createTextNode('Innlogget som ' + bruker.navn), el('small', {}, 'Lagres ikke sammen med svarene')] : []));
  if ($('innhold')) $('innhold').replaceWith(innholdListe());
  if ($('lever')) $('lever').replaceWith(leverBoks());
}
$('tilLever').addEventListener('click', () => { const l = $('lever'); if (l) { l.scrollIntoView({block: 'start'}); const k = $('leverKnapp'); if (k) k.focus({preventScroll: true}); } });

/* ---------- Innsending ---------- */
async function lever() {
  if (sender) return;
  if (DEMO) { tegnTakk(false); return; }
  sender = true; feil = ''; oppdater();
  try {
    // Svarene sendes uten noe om hvem du er. Serveren registrerer separat at du har levert.
    const r = await fetch('api/svar', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Halvaar': '1'}, body: JSON.stringify({runde: DATA.runde, svar})});
    if (r.status === 409) { slettUtkast(); sender = false; tegnTakk(true); return; }
    if (r.status === 403) { sender = false; tegnMelding(...MELDINGER['ikke-invitert']); return; }
    if (r.status === 423) { sender = false; tegnMelding(...MELDINGER['stengt']); return; }
    if (!r.ok) throw new Error('status ' + r.status);
    slettUtkast(); sender = false; tegnTakk(false);
  } catch (e) {
    sender = false; feil = 'Svarene ble ikke levert. Ingenting er sendt. Prøv igjen om litt.'; oppdater();
  }
}
function tegnMelding(tittel, tekst) {
  document.body.classList.add('mork');
  $('side').replaceChildren(el('section', {class: 'takk'},
    el('div', {class: 'eyebrow'}, DATA.tittel + ' · ' + DATA.periode), el('h1', {}, tittel), el('p', {class: 'ingress'}, tekst)));
  $('tilLever').classList.add('skjult');
  $('status').textContent = DATA.tittel + ' · ' + DATA.periode;
  $('hvem').replaceChildren(...(bruker ? [document.createTextNode('Innlogget som ' + bruker.navn)] : []));
}
const MELDINGER = {
  'ikke-invitert': ['Du står ikke på listen', 'Undersøkelsen går til konsulentene i Alv. Mener du at du skulle vært med, ta kontakt med Marcus.'],
  'ikke-apnet': ['Undersøkelsen har ikke åpnet ennå', 'Kom tilbake når du får beskjed om at den er åpen.'],
  'stengt': ['Undersøkelsen er stengt', 'Svarfristen er ute. Takk til alle som svarte.'],
};
async function start() {
  if (DEMO) { tegnSkjema(); return; }
  $('demo').classList.add('skjult');
  let meg;
  try {
    const r = await fetch('api/meg');
    if (!r.ok) throw new Error('status ' + r.status);
    meg = await r.json();
  } catch (e) {
    tegnMelding('Noe gikk galt', 'Siden fikk ikke kontakt med serveren. Last siden på nytt om litt.');
    return;
  }
  bruker = {navn: meg.navn};
  if (meg.status === 'levert') { slettUtkast(); tegnTakk(true); return; }
  if (MELDINGER[meg.status]) { tegnMelding(...MELDINGER[meg.status]); return; }
  hentUtkast();
  tegnSkjema();
}
start();
</script>
